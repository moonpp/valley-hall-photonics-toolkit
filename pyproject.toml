[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "valley-hall-photonics-toolkit"
version = "0.1.0"
description = "Radiation-channel kinematics and archived valley-Hall supercell estimate replay"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Nouh Al Busaidi"}]
dependencies = []

[project.scripts]
valleyhall = "valleyhall.__main__:main"

[tool.setuptools]
packages = ["valleyhall"]
